version: '3.8'

services:
  db:
    image: mysql:8.0.36
    env_file:
      - .env
    restart: always
    ports:
      - "3306:3306"     # це лишаєш тільки якщо хочеш доступ до БД ззовні сервера
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080

volumes:
  mysql-data:
