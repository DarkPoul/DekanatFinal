version: '3.8'

services:
  db:
    image: mysql:8.0.36
    env_file:
      - .env
    ports:
      - "3306:3306"
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    ports:
      - "8080:8080"
    environment:
      # На випадок якщо хочеш порт керувати через env
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod

volumes:
  mysql-data:
