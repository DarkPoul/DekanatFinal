spring:
  application:
    name: Dekanat
  datasource:
    url: ${DB_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        generate_statistics: true

vaadin:
  launch-browser: false  # у контейнері браузер відкривати не треба

upload:
  dir: uploads

logging:
  level:
    root: INFO
    com.esvar.dekanat: DEBUG

server:
  port: ${SERVER_PORT:8080}
